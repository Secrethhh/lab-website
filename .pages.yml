content:
  - name: publications
    label: 论文与成果
    type: collection
    path: src/publications
    format: yaml-frontmatter
    filename: '{primary}.md'
    view:
      primary: title
      fields: [title, year, direction, status, draft]
    fields:
      - {name: title, label: 成果标题, type: string, required: true}
      - {name: year, label: 年份, type: number, required: true}
      - name: direction
        label: 研究方向
        type: select
        required: true
        options:
          values:
            - {value: security, label: 多媒体安全}
            - {value: hiding, label: 信息隐藏}
      - {name: venue, label: 会议或期刊, type: string}
      - {name: status, label: 发表状态, type: string}
      - {name: authors, label: 作者列表, type: string}
      - {name: summary, label: 简介, type: text, required: true}
      - {name: featured, label: 首页重点展示, type: boolean, default: false}
      - {name: draft, label: 草稿（不展示在网站）, type: boolean, default: true}
      - {name: paper, label: 论文链接（HTTPS）, type: string}
      - {name: code, label: 代码链接（HTTPS）, type: string}
      - {name: data, label: 数据集链接（HTTPS）, type: string}
      - {name: source, label: 信息依据, type: string}
      - {name: body, label: 详细介绍, type: rich-text}
