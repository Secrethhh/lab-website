content:
  - name: team
    label: 团队人数
    type: file
    path: src/_data/team.json
    format: json
    fields:
      - name: doctoral
        label: 博士人数（暂用 x，确认后填写数字）
        type: string
        required: true
      - name: masters
        label: 硕士人数（暂用 y，确认后填写数字）
        type: string
        required: true
  - name: news
    label: 首页 News（2026 年）
    type: file
    path: src/_data/news.json
    format: json
    fields:
      - name: items
        label: 动态列表
        type: object
        list: true
        fields:
          - name: date
            label: 年月（YYYY-MM，如 2026-09）
            type: string
            required: true
          - name: icon
            label: 图标（📣 活动 / 🎉 论文）
            type: string
          - name: text
            label: 英文动态句子（链接前）
            type: text
            required: true
          - name: title
            label: 链接标题（论文使用原版英文题目）
            type: string
            required: true
          - name: url
            label: 公开页面链接（HTTPS）
            type: string
            required: true
          - name: suffix
            label: 补充说明（英文，可留空）
            type: text
          - name: source
            label: 核实来源链接（不显示在前台）
            type: string
            required: true
          - name: draft
            label: 草稿（不展示）
            type: boolean
            default: true
  - name: faculty
    label: 任延珍老师个人介绍
    type: file
    path: src/_data/faculty.json
    format: json
    fields:
      - name: role
        label: 职称与导师资格
        type: string
      - name: roleEn
        label: 职称与导师资格（英文）
        type: string
      - name: email
        label: 联系邮箱
        type: string
      - name: verified
        label: 资料核对日期
        type: string
      - name: source
        label: 学院官方来源
        type: string
      - name: sections
        label: 个人介绍栏目
        type: object
        list: true
        fields:
          - name: id
            label: 栏目英文标识（保持不重复）
            type: string
          - name: title
            label: 栏目标题
            type: string
          - name: titleEn
            label: 栏目标题（英文）
            type: string
          - name: entries
            label: 内容条目
            type: object
            list: true
            fields:
              - name: period
                label: 时间段（可不填）
                type: string
              - name: text
                label: 中文内容
                type: text
              - name: textEn
                label: 英文内容
                type: text
  - name: publications
    label: 论文与成果
    type: collection
    path: src/publications
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields:
        - title
        - year
        - direction
        - status
        - draft
    fields:
      - name: title
        label: 论文正式英文原题（与原文一致）
        type: string
        required: true
      - name: year
        label: 年份
        type: number
        required: true
      - name: direction
        label: 研究方向
        type: select
        required: true
        options:
          values:
            - name: security
              label: 多媒体安全
            - name: hiding
              label: 信息隐藏
      - name: modality
        label: 模态（人脸归视频；图像论文选图像）
        type: select
        required: true
        options:
          values:
            - name: audio
              label: 语音 / 音频
            - name: video
              label: 视频（含人脸与音视频）
            - name: image
              label: 图像
      - name: venue
        label: 会议或期刊简称（如 TIFS / CVPR / ACM MM）
        type: string
      - name: status
        label: 发表状态（英文，如 Published / Accepted / Preprint）
        type: string
      - name: authors
        label: 作者列表
        type: string
      - name: summary
        label: 英文研究简介（不要填写中文译文）
        type: text
        required: true
      - name: featured
        label: 首页代表作（已录用或已发表，A 类会议 / TIFS）
        type: boolean
        default: false
      - name: draft
        label: 草稿（不展示在网站）
        type: boolean
        default: true
      - name: paper
        label: 论文链接（HTTPS）
        type: string
      - name: code
        label: 代码链接（HTTPS）
        type: string
      - name: data
        label: 数据集链接（HTTPS）
        type: string
      - name: source
        label: 信息依据
        type: string
      - name: resourceName
        label: 资源简称（有代码或数据集时填写）
        type: string
      - name: problem
        label: Research problem（英文）
        type: text
      - name: method
        label: Method（英文）
        type: text
      - name: resourceDescription
        label: Resources（英文）
        type: text
      - name: usage
        label: Use cases（英文）
        type: text
      - name: body
        label: 英文详细介绍
        type: rich-text
